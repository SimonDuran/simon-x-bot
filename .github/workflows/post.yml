name: Post to X

on:
  schedule:
    - cron: '0 14 * * *'  # 9am EST
    - cron: '0 16 * * *'  # 11am EST
    - cron: '0 18 * * *'  # 1pm EST
    - cron: '0 20 * * *'  # 3pm EST
    - cron: '0 22 * * *'  # 5pm EST
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Run scheduler
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_SECRET: ${{ secrets.API_SECRET }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}
        run: python scheduler.py
      
      - name: Commit updated posts.json
        run: |
          git config --global user.email "bot@simon-x-bot"
          git config --global user.name "Simon X Bot"
          git add posts.json
          git diff --staged --quiet || git commit -m "mark posts as published"
          git push